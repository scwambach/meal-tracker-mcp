services:
  meal-tracker-mcp:
    image: ghcr.io/scwambach/meal-tracker-mcp:latest
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3030/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional: exposes the server through a Cloudflare Tunnel.
  # Start with: docker compose --profile tunnel up -d
  # In the tunnel's Public Hostname settings, point the hostname at http://meal-tracker-mcp:3030
  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - meal-tracker-mcp
